
name: Python Ecommerce CI

# When should GitHub run this workflow?
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# Permissions required by the workflow
permissions:
  contents: read

# Jobs to execute
jobs:

  test:

    # GitHub provides an Ubuntu Linux machine
    runs-on: ubuntu-latest

    steps:

      # Step 1: Download repository code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Install Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Step 4: Run unit tests
      - name: Run unit tests
        run: |
          pytest -v

